---

x-condition-healthy: &healthy
  condition: service_healthy

x-healthcheck-defaults: &healthcheck-defaults
  interval: 5s
  timeout: 10s
  start_period: 10s
  retries: 5

services:
  traject:
    build: 
      context: .
      target: development
    volumes:
      - .:/app
      - gem_cache:/gems
    environment:
      - SOLR_URL=http://solr-sdr-catalog:9033/solr/catalog
      - REDIRECT_FILE=/dev/null
      #- NO_DB=1
    network_mode: host
    command: sleep infinity

  test:
    build: 
      context: .
      target: development
    volumes:
      - .:/app
      - gem_cache:/gems
    command: bundle exec rspec
    environment:
      - JRUBY_OPTS=--debug
      - PUSHGATEWAY=http://pushgateway:9091
      - REDIRECT_FILE=/dev/null
      - SOLR_URL=http://solr-sdr-catalog:9033/solr/catalog
      - MARIADB_HT_RO_USERNAME=ht_rights
      - MARIADB_HT_RO_PASSWORD=ht_rights
      - MARIADB_HT_RO_HOST=mariadb
      - MARIADB_HT_RO_DATABASE=ht
    depends_on:
      pushgateway: *healthy
      mariadb: *healthy
      solr-sdr-catalog: *healthy

  solr-sdr-catalog:
    build:
      context: .
      dockerfile: solr/solrcloud/Dockerfile
    #image: hattrust/solr-sdr-catalog:latest
    ports:
      - "9033:8983" # Map host port 9033 to container port 8983 to avoid conflicts with any local Solr instances
    # command: solr-foreground # Explicitly ensures cloud mode is used, even if the image's default command changes
    environment:
      SOLR_OPTS: "-Dsun.misc.Unsafe=allow -Djavax.xml.accessExternalDTD=file" # Add this option until next Update Solr release to avoid the warning the sun.misc.Unsafe
      ZK_HOST: zoo1:2181
      SOLR_MODULES: analysis-extras,scripting # Enable Solr modules explicitly
    networks: [solr]
    depends_on:
      zoo1:
        condition: service_healthy
    healthcheck:
      interval: 30s
      timeout: 10s
      retries: 5
      test: [ "CMD", "curl", "-fsS", "http://localhost:8983/solr/admin/info/system" ]
  zoo1:
    image: zookeeper:3.9.0
    container_name: zoo1
    restart: always
    hostname: zoo1
    environment:
      ZOO_MY_ID: 1
      ZOO_SERVERS: server.1=zoo1:2888:3888;2181
      ZOO_4LW_COMMANDS_WHITELIST: "mntr,conf,ruok"
    networks: [solr]
    #volumes:
    #  - zoo1_data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "-w", "2", "localhost", "2181"] # Check if ZooKeeper is listening on port 2181
      interval: 30s
      timeout: 10s
      retries: 5
  solr-init-catalog:
    build:
      context: .
      dockerfile: solr/solrcloud/Dockerfile
    depends_on:
      solr-sdr-catalog:
        condition: service_healthy
    volumes:
      - ./solr/solrcloud/conf:/catalog_config/conf:ro
    environment:
      SOLR_OPTS: "-Dsun.misc.Unsafe=allow"
      SOLR_MODULES: analysis-extras,scripting # Ensures init container can compile ICU schemas - solr modules
    networks: [solr]
    entrypoint:
      - bash
      - -c
      - |
        set -e
        echo "Uploading configset via zk upconfig (marks configset as trusted)..."
        /opt/solr/bin/solr zk upconfig \
          -n catalog-config \
          -d /catalog_config/conf \
          -z zoo1:2181

        echo "Creating collection..."
        curl -f "http://solr-sdr-catalog:8983/api/collections" \
          -H "Content-Type: application/json" \
          -d '{
            "name": "catalog",
            "config": "catalog-config",
            "numShards": 1,
            "replicationFactor": 1
          }'

        echo "Collection created successfully."
  mariadb:
    image: ghcr.io/hathitrust/db-image:latest
    ports:
      - "3306:3306"
    environment:
      # setting via MYSQL_ROOT_PASSWORD didn't work; this at least
      # makes it clear that we have to dig out its generated root password
      # from its startup
      MYSQL_RANDOM_ROOT_PASSWORD: 1
      MYSQL_DATABASE: ht
      MYSQL_USER: ht_rights
      MYSQL_PASSWORD: ht_rights
    healthcheck:
      <<: *healthcheck-defaults
      test: [ "CMD", "healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized" ]

  pushgateway:
    image: prom/pushgateway
    ports:
      - 9092:9091
    healthcheck:
      <<: *healthcheck-defaults
      test: [ "CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null", "pushgateway:9091/-/healthy" ]
networks:
    solr:
      driver: bridge
volumes:
  gem_cache:
  solr1_data: null
  zoo1_data: null