---

x-condition-healthy: &healthy
  condition: service_healthy

x-condition-complete: &complete
  condition: service_completed_successfully

x-healthcheck-defaults: &healthcheck-defaults
  interval: 5s
  timeout: 10s
  start_period: 10s
  retries: 5

x-test-default-env: &test-default-env
  JRUBY_OPTS: --debug
  PUSHGATEWAY: http://pushgateway:9091
  REDIRECT_FILE: /dev/null
  MARIADB_HT_RO_USERNAME: ht_rights
  MARIADB_HT_RO_PASSWORD: ht_rights
  MARIADB_HT_RO_HOST: mariadb
  MARIADB_HT_RO_DATABASE: ht

services:
  traject:
    build: 
      context: .
      target: development
    volumes:
      - .:/app
      - gem_cache:/gems
    environment:
      - SOLR_URL=http://solr-sdr-catalog:9033/solr/catalog
      - REDIRECT_FILE=/dev/null
      #- NO_DB=1
    network_mode: host
    command: sleep infinity

  # TODO: deduplicate more shared stuff between test and test-solrcloud
  test:
    build:
      context: .
      target: development
    volumes:
      - .:/app
      - gem_cache:/gems
    command: bundle exec rspec
    environment:
      <<: *test-default-env
      SOLR_URL: http://solr-sdr-catalog:9033/solr/catalog
    depends_on:
      pushgateway: *healthy
      mariadb: *healthy
      solr-sdr-catalog: *healthy

  test-solrcloud:
    build:
      context: .
      target: development
    volumes:
      - .:/app
      - gem_cache:/gems
    command: bundle exec rspec
    environment:
      <<: *test-default-env
      SOLR_URL: http://solr-sdr-catalog-solrcloud:9033/solr/catalog
    depends_on:
      pushgateway: *healthy
      mariadb: *healthy
      init-solr-sdr-catalog-solrcloud: *complete

  solr-sdr-catalog:
    build: solr
    ports:
      - "9034:9033"
    healthcheck:
      <<: *healthcheck-defaults
      test: [ "CMD", "curl","-s","-f","http://localhost:9033/solr/catalog/admin/ping" ]

  solr-sdr-catalog-solrcloud:
    extends:
      file: solr/solrcloud/docker-compose.yml
      service: solr-sdr-catalog

  zoo1:
    extends:
      file: solr/solrcloud/docker-compose.yml
      service: zoo1

  # Build an empty Solrcloud with our config set
  init-solr-sdr-catalog-solrcloud:
    build:
      context: .
      dockerfile: solr/solrcloud/Dockerfile.empty
    depends_on:
      solr-sdr-catalog-solrcloud: *healthy
    environment:
      SOLR_HOST: solr-sdr-catalog-solrcloud:9033
      ZK_HOST: zoo1:2181

  mariadb:
    image: ghcr.io/hathitrust/db-image:latest
    ports:
      - "3306:3306"
    environment:
      # setting via MYSQL_ROOT_PASSWORD didn't work; this at least
      # makes it clear that we have to dig out its generated root password
      # from its startup
      MYSQL_RANDOM_ROOT_PASSWORD: 1
      MYSQL_DATABASE: ht
      MYSQL_USER: ht_rights
      MYSQL_PASSWORD: ht_rights
    healthcheck:
      <<: *healthcheck-defaults
      test: [ "CMD", "healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized" ]

  pushgateway:
    image: prom/pushgateway
    ports:
      - 9092:9091
    healthcheck:
      <<: *healthcheck-defaults
      test: [ "CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null", "pushgateway:9091/-/healthy" ]

volumes:
  gem_cache:
